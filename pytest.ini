[pytest]
# Pytest configuration for GIMP OpenVINO AI Plugins

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    smoke: Smoke tests for basic functionality
    integration: Integration tests for component interaction
    unit: Unit tests for individual components
    slow: Tests that take significant time to run
    socket: Tests involving socket communication
    model: Tests involving model loading and inference
    plugin: Tests involving GIMP plugin interfaces

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=gimpopenvino
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=0

# Coverage options
[coverage:run]
source = gimpopenvino
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
